name: Build Rapido Auto Clicker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rapido APK
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout repository
      uses: actions/checkout@v4

    - name: Step 2 - Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Step 3 - Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Step 4 - Accept Android SDK Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Step 5 - Build Rapido Auto Clicker APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace

    - name: Step 6 - Locate and Collect APK
      run: |
        mkdir -p build-output
        find . -type f -name "*.apk" -not -path "./build-output/*" -exec cp -v {} build-output/Rapido-AutoClicker-Free.apk \;
        echo "=== Successfully built APK ==="
        ls -lh build-output/

    - name: Step 7 - Upload APK Download Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rapido-AutoClicker-Free-APK
        path: build-output/Rapido-AutoClicker-Free.apk
        retention-days: 30
