name: Build Rapido Auto Clicker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rapido APK
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout repository
      uses: actions/checkout@v4

    - name: Step 2 - Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Step 3 - Extract ZIP and Organize Structure
      run: |
        echo "=== Checking repository contents ==="
        ls -la
        if ls *.zip 1> /dev/null 2>&1; then
          for z in *.zip; do
            echo "Unpacking $z..."
            unzip -o "$z"
          done
        fi
        if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
          FOUND=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path '*/.*' | head -n 1)
          if [ -n "$FOUND" ]; then
            SUB=$(dirname "$FOUND")
            echo "Moving project from $SUB to root..."
            cp -r "$SUB"/* . || true
          fi
        fi
        echo "=== Root Structure ==="
        ls -la

    - name: Step 4 - Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Step 5 - Prepare Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.10.2 --distribution-type bin || true
        chmod +x ./gradlew || true

    - name: Step 6 - Accept Android SDK Licenses
      run: |
        yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Step 7 - Build Rapido Auto Clicker APK
      run: |
        chmod +x ./gradlew || true
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Step 8 - Locate and Collect APK
      run: |
        mkdir -p build-output
        find . -type f -name "*.apk" -not -path "./build-output/*" -exec cp -v {} build-output/Rapido-AutoClicker-Free.apk \;
        echo "Collected APKs:"
        ls -lh build-output/

    - name: Step 9 - Upload APK Download Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rapido-AutoClicker-Free-APK
        path: build-output/Rapido-AutoClicker-Free.apk
        retention-days: 30
