name: Build Rapido Auto Clicker APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Rapido APK
    runs-on: ubuntu-latest

    steps:
    - name: Step 1 - Checkout repository
      uses: actions/checkout@v4

    - name: Step 2 - Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Step 3 - Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Step 4 - Accept SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Step 5 - Build APK with Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: '8.10.2'
        arguments: assembleDebug --stacktrace --no-daemon

    - name: Step 6 - Collect Built APK
      run: |
        mkdir -p build-output
        find . -type f -name "*.apk" -not -path "./build-output/*" -exec cp -v {} build-output/Rapido-AutoClicker-Free.apk \;
        echo "Collected APKs:"
        ls -lh build-output/

    - name: Step 7 - Upload APK Download Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rapido-AutoClicker-Free-APK
        path: build-output/Rapido-AutoClicker-Free.apk
        retention-days: 30
